<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Adapter Sync — 抽取層測試</title>
<style>
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, "PingFang TC", monospace;
    font-size: 13px; line-height: 1.7; padding: 24px 28px;
    background: #0d1b16; color: #d7e6df;
  }
  h1 { font-size: 16px; margin-bottom: 4px; color: #fff; }
  .note { color: #7f9c90; font-size: 12px; margin-bottom: 18px; line-height: 1.7; }
  .head {
    font-size: 15px; font-weight: 700; padding: 10px 14px;
    border-radius: 8px; margin-bottom: 18px;
  }
  .head.good { background: #064e3b; color: #6ee7b7; }
  .head.bad { background: #7f1d1d; color: #fecaca; }
  h2 { font-size: 12px; color: #6ee7b7; margin: 18px 0 6px; letter-spacing: 0.06em; }
  .case { white-space: pre-wrap; padding: 1px 0; }
  .case.ok { color: #9db9ad; }
  .case.bad { color: #fca5a5; font-weight: 700; }
</style>
</head>
<body>
<h1>Adapter Sync — 抽取層測試</h1>
<p class="note">
  直接重新整理就好，不用清快取——每支檔都帶了時間戳。
</p>
<div id="out"></div>

<script>
  // 網址上的 ?v= 只對這一頁的 HTML 有效，<script src> 指到的 .js
  // 照樣走瀏覽器快取。「改了程式卻沒反應」有一半是這個，而且它看起來
  // 完全像「我的修改沒生效」，於是往錯的方向查一輪。
  // 每次載入都掛一個時間戳，這一類問題就整個不存在。
  (function () {
    var stamp = String(Date.now());
    [
      '../extension/src/ids.js',
      '../extension/src/citation.js',
      '../extension/src/adapters.js',
      '../extension/src/extract.js',
      '../extension/src/naming.js',
      'run.js',
    ].forEach(function (src) {
      // document.write 在解析階段會保持順序，動態 appendChild 不會——
      // run.js 比 ids.js 早跑的話，錯誤訊息會指向完全無關的地方。
      document.write('<script src="' + src + '?t=' + stamp + '"><\/script>');
    });
  })();
</script>
</body>
</html>
